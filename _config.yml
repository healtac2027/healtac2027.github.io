# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: HealTAC 2027
email:
description: >- # this means to ignore newlines until "baseurl:"
  10th Healthcare Text Analytics Conference
# Organisation page: the site is served from the domain root, so baseurl is empty.
# Keep `url` without a trailing slash, or canonical/og:url pick up a double slash.
url: https://healtac2027.github.io
baseurl: ""
twitter_username: uk_healtex
github_username: healtac2027
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Europe/London

include:
  - _pages

# Plugins (previously gems:)
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  links:
    - label:  |
        <strong style='color:#6495ED;'>KEY DATES</strong>
        <table style="width:100%; border-collapse: collapse; table-layout: fixed;">
          <tbody>

            <tr>
              <td style="padding:6px 4px; vertical-align: top;"><strong>First call</strong></td>
              <td style="padding:6px 4px; vertical-align: top;">TBC</td>
            </tr>

            <tr>
              <td style="padding:6px 4px; vertical-align: top;"><strong>Submission deadline</strong></td>
              <td style="padding:6px 4px; vertical-align: top;">TBC</td>
            </tr>

            <tr>
              <td style="padding:6px 4px; vertical-align: top;"><strong>Notification</strong></td>
              <td style="padding:6px 4px; vertical-align: top;">TBC</td>
            </tr>

            <tr>
              <td style="padding:6px 4px; vertical-align: top;"><strong>Registration opens</strong></td>
              <td style="padding:6px 4px; vertical-align: top;">TBC</td>
            </tr>

            <tr>
              <td style="padding:6px 4px; vertical-align: top;"><strong>Conference</strong></td>
              <td style="padding:6px 4px; vertical-align: top;">TBC</td>
            </tr>

          </tbody>
