    - label: "<strong style='color:#6495ED;'>SPONSORS</strong><br><span style='color: black;'>To be confirmed</span>"
      icon: "fas fa-handshake"
      url: "javascript:void(0)"

footer:
  links:
    - label: "Twitter/X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://twitter.com/uk_healtex"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/healtac2027/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
