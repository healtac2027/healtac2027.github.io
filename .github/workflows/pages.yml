name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["healtac2027-draft"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let in-progress runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Requires GitHub Pages to be enabled once by hand, with the source set to
      # "GitHub Actions" (Settings -> Pages). configure-pages can in principle enable
      # it via `enablement: true`, but creating a Pages site needs admin rights that
      # GITHUB_TOKEN does not have here -- it fails with "Resource not accessible by
      # integration".
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # _config.yml points at the site's final home. Override url/baseurl here so the
      # draft builds correctly for whichever repository is actually serving it.
      - name: Build with Jekyll
        run: |
          printf 'url: "%s"\nbaseurl: "%s"\n' \
            "${{ steps.pages.outputs.origin }}" \
            "${{ steps.pages.outputs.base_path }}" > _config_deploy.yml
          cat _config_deploy.yml
          bundle exec jekyll build --config _config.yml,_config_deploy.yml
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
